    use_enu: true
    orientation_covariance: [0.02, 0.0, 0.0,
                              0.0, 0.02, 0.0,
                              0.0, 0.0, 0.04]
    angular_velocity_covariance: [0.000025, 0.0, 0.0,
                                   0.0, 0.000025, 0.0,
                                   0.0, 0.0, 0.000025]
    linear_acceleration_covariance: [0.0001, 0.0, 0.0,
                                     0.0, 0.0001, 0.0,
                                     0.0, 0.0, 0.0001]
    magnetic_covariance: [0.01, 0.0, 0.0,
                          0.0, 0.01, 0.0,
                          0.0, 0.0, 0.01]
