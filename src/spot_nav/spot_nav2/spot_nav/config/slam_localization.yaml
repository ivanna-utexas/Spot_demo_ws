slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: localization # Localization mode

    # LiDAR Slicing (optional, similar to AMCL)
    # If not set, uses defaults. 

    # Localization Mode Specifics
    # In localization mode, we need to load a map.
    # SLAM Toolbox usually loads a serialized map file (.posegraph or .data), NOT a PGM.
    # If map_file_name is provided in launch, it uses that.
    # map_file_name: /path/to/map (set via launch arg)
    # map_start_pose: [0.0, 0.0, 0.0]
    
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 # 20Hz
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 20.0 # Match lidar
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 # program needs a larger stack size to serialize large maps

    # Matching
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    enable_interactive_mode: true

    # General
    use_scan_matching: true
    use_scan_barycenter: true
