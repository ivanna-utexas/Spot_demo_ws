slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver # The non-linear least squares solver to use
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY # Linear solver type for Ceres
    ceres_preconditioner: SCHUR_JACOBI # Preconditioner for the linear solver
    ceres_trust_strategy: LEVENBERG_MARQUARDT # Trust region strategy
    ceres_dogleg_type: TRADITIONAL_DOGLEG # Dogleg strategy type
    ceres_loss_function: HUBER  # Loss function to handle outliers robustly (e.g. moving objects)

    # ROS Parameters
    odom_frame: odom # Frame ID for odometry
    map_frame: map # Frame ID for the map
    base_frame: base_link # Frame ID for the robot base
    scan_topic: /scan # Topic name for laser scans
    use_map_saver: true # Enable the map saver service
    mode: mapping # Operation mode: 'mapping' or 'localization'

    # Initial Pose (if not starting from 0,0,0)
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false # Enable debug logging
    throttle_scans: 1 # Process every Nth scan (1 = process all)
    transform_publish_period: 0.02 # Interval to publish the map->odom transform (0.02s = 50Hz)
    map_update_interval: 5.0 # Interval to update the map visualization
    resolution: 0.05 # Map resolution in meters per pixel
    min_laser_range: 0.2 # Minimum range to use for map building (rastering)
    max_laser_range: 10.0 # Maximum range to use for map building
    minimum_time_interval: 0.05 # Minimum time between scans to process (Reduced for fast motion!)
    transform_timeout: 0.5 # Timeout for TF lookups
    tf_buffer_duration: 40.0 # Duration to keep TF history
    stack_size_to_use: 40000000 # Stack size for serialization (large maps need more)
    enable_interactive_mode: true # Enable interactive mode for the plugin

    # General Parameters
    use_scan_matching: true # Enable scan matching for odometry correction
    use_scan_barycenter: true # Use barycenter of scan points for alignment
    minimum_travel_distance: 0.0 # Minimum distance travel before processing a new scan
    minimum_travel_heading: 0.0 # Minimum rotation before processing a new scan
    scan_buffer_size: 30  # Number of scans to keep in buffer for matching
    scan_buffer_maximum_scan_distance: 10.0 # Max distance of scans in buffer
    link_match_minimum_response_fine: 0.1  # Minimum match score to accept a link
    link_scan_maximum_distance: 1.5 # Max distance to link scans
    loop_search_maximum_distance: 3.0  # Max distance to search for loop closures
    do_loop_closing: true # Enable loop closure detection
    loop_match_minimum_chain_size: 10  # Min number of matches in a chain to accept loop
    loop_match_maximum_variance_coarse: 3.0  # Max variance allowed for coarse loop matching
    loop_match_minimum_response_coarse: 0.35 # Min score for coarse loop match
    loop_match_minimum_response_fine: 0.45 # Min score for fine loop match

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5 # Search window size (meters)
    correlation_search_space_resolution: 0.01 # Search resolution (meters)
    correlation_search_space_smear_deviation: 0.1  # Smear deviation for correlation (0.005 - 0.1)

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0  # Search window size for loops (meters)
    loop_search_space_resolution: 0.05 # Search resolution for loops (meters)
    loop_search_space_smear_deviation: 0.25  # Smear deviation for loops

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5 # Penalty for distance variance (0.0 = trust scan match completely)
    angle_variance_penalty: 1.0 # Penalty for angle variance (0.0 = trust scan match completely)

    fine_search_angle_offset: 0.00349 # Angle search range for fine matching (~0.2 deg)
    coarse_search_angle_offset: 0.349 # Angle search range for coarse matching (~20 deg)
    coarse_angle_resolution: 0.0349 # Angle resolution for coarse matching (~2 deg)
    minimum_angle_penalty: 0.9 # Penalty for large angle differences
    minimum_distance_penalty: 0.5 # Penalty for large distance differences
    use_response_expansion: true # Expand search if no good match found
    min_pass_through: 2 # Minimum number of hits to consider a cell occupied
    occupancy_threshold: 0.1 # Probability threshold for occupancy