name: navstack
root: ~/nav_ws

windows:
  - simulator:
      layout: main-vertical
      panes:
        - 
        - ros2 launch azure_kinect_ros_driver driver.launch.py depth_mode:=NFOV_UNBINNED color_resolution:=720P fps:=30
        - ros2 launch av_navigation navigation.launch.py map:=<%= ENV['MAP'] || 'ahg_2' %>
        - ros2 launch spot_driver spot_driver.launch.py
        - ros2 launch velodyne_pointcloud VLP16_points.launch.py
        - vnc
        - sleep 10; DISPLAY=:9 rviz2 -d rviz2/navstack.rviz