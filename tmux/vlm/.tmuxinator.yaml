name: navstack
root: ~/nav_ws

windows:
  - simulator:
      layout: main-vertical
      panes:
        - cd src/vlm_policy && python -m pytest test/ -v --tb=short
        - ros2 launch ironback_description description.launch.py
        - ros2 launch people_detector people_format_adapter.launch.py
        - ros2 launch azure_kinect_ros_driver driver.launch.py depth_mode:=NFOV_UNBINNED color_resolution:=720P fps:=30
        # - ros2 launch spot_nav navigation.launch.py map:=<%= ENV['MAP'] || 'ahg_2' %>
        - ros2 launch spot_nav navigation.launch.py spot_config_file:=/home/ros/nav_ws/params/spot_driver.yaml map:=ahg_home_Feb12
        # - ros2 launch spot_driver spot_driver.launch.py --ros-args -p BOSDYN_CLIENT_USERNAME:=ros -p BOSDYN_CLIENT_PASSWORD:=rosrosros
        - ros2 launch spot_driver spot_driver.launch.py config_file:=/home/ros/nav_ws/params/spot_driver.yaml
        - ros2 launch spot_velodyne velodyne.launch.py
        - ros2 run spot_joy teleop_node
        # - ros2 launch hdl_people_tracking hdl_people_tracking.launch.py
        - ros2 launch hdl_people_tracking hdl_people_tracking.launch.py static_sensor:=true
        # - ros2 launch social_nav_policy social_nav_policy_launch.py publish_debug:=true --ros-args --log-level debug
        - ros2 launch social_nav_policy social_nav_policy_launch.py publish_debug:=true log_level:=debug
        # - ros2 launch social_nav_policy social_nav_costmap_launch.py --ros-args --log-level debug
        - ros2 launch social_nav_policy social_nav_costmap_launch.py log_level:=debug
        - vnc
        - sleep 10; DISPLAY=:9 rviz2 -d rviz2/navstack.rviz