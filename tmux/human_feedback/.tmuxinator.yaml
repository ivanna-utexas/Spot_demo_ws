name: subjective_feedback
root: ~/nav_ws

pre_window: source /opt/ros/humble/setup.bash && source ~/nav_ws/install/setup.bash

windows:
    - human_feedback_app:
        layout: main-vertical
        panes:
          - sleep 8; clear; echo "YOUR ROBOT IP ADDRESS IS:"; hostname -I; echo "--------------------------------"; echo "Access the Dashboard on PORT 8080"; echo ""; echo "Press Ctrl+B then D to detach."; sleep infinity
          - ros2 launch people_detector people_format_adapter.launch.py
          - ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9091
          - ros2 run arduino_multicolored_lightswitch lightswitch_node
          - cd ~/nav_ws/src/human_feedback_app && ./restart_backend.sh && tail -f /tmp/survey_app.log
          # Standalone panes: launched when STANDALONE=1 (no navstack running)
          - <%= ENV['STANDALONE'] == '1' ? 'ros2 launch spot_velodyne velodyne.launch.py device_ip:=192.168.50.201' : 'echo "Velodyne: provided by navstack"; sleep infinity' %>
          - <%= ENV['STANDALONE'] == '1' ? 'sleep 5; ros2 launch hdl_people_tracking hdl_people_tracking.launch.py' : 'echo "People tracking: provided by navstack"; sleep infinity' %>
          - <%= ENV['STANDALONE'] == '1' ? 'ros2 run av_recorder bag_recorder' : 'echo "Bag recorder: provided by navstack"; sleep infinity' %>